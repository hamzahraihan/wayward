# wayward default configuration
#
# This file is the bundled template. On first run wayward copies it to:
#   C:\Users\<user>\.config\.wayward\wayward.toml
# An existing file is never overwritten. Edit that copy to change the bar.
#
# The config folder defaults to ~/.config/.wayward (resolved from the home
# directory, NOT %APPDATA% or %LOCALAPPDATA%). Set the WAYWARD_CONFIG_DIR
# environment variable to override the folder, which is useful for testing.
#
# TOML is the single source of truth: the settings GUI reads and writes this
# same file. Unknown keys are ignored with a warning; missing keys fall back
# to the values in this template.
#
# Secrets (API keys, tokens) NEVER go in this file. They are stored in the
# Windows Credential Manager via the keyring and are read from there at runtime.

[bar]
position = "top"        # top | bottom
height = 28             # logical pixels, 16..=128
padding = 8             # logical pixels
monitor = ""            # reserved: milestone 1 uses the primary monitor only

[font]
# A monospace font ships with Windows 10/11. A Nerd Font may be installed
# separately and selected here to show icons; icons appear in later milestones
# and no font is bundled with wayward. Change this family to a Nerd Font name
# (for example "JetBrainsMono Nerd Font") once you have installed one.
family = "Cascadia Mono"  # monospace, ships with Windows 10/11
size = 12.0             # 8.0..=24.0

# Default theme: Catppuccin Mocha. Use these values exactly. If a different
# shade is needed, add a new named key instead of hardcoding a color in a view.
# A missing key falls back to the value below, not to an arbitrary color.
[theme]
name = "catppuccin-mocha"
background = "#1e1e2e"   # base
foreground = "#cdd6f4"   # text
accent = "#cba6f7"       # mauve
muted = "#6c7086"        # overlay0
warn = "#f9e2af"         # yellow
urgent = "#f38ba8"       # red
surface = "#313244"      # surface0, for borders and empty progress cells
success = "#a6e3a1"      # green, for healthy usage levels

# Module order in the left / center / right sections of the bar.
[layout]
left = ["clock", "cpu", "ram", "battery"]
center = []
right = []

[modules.clock]
format = "%H:%M:%S"
interval_ms = 1000

[modules.cpu]
interval_ms = 2000  # stat poll interval, 2000..=5000

[modules.ram]
interval_ms = 3000  # stat poll interval, 2000..=5000

[modules.battery]
interval_ms = 5000  # stat poll interval, 2000..=5000

# Audio volume from the default render endpoint (Windows audio API).
# The cell shows `VOL N%` or `VOL muted`. Disabled by default; add "volume"
# to [layout] left/center/right to show it.
[modules.volume]
interval_ms = 2000  # poll interval, 2000..=5000

# Network connectivity from the Windows Network List Manager.
# The cell shows `NET up` (normal) or `NET down` (warn). Disabled by default.
[modules.network]
interval_ms = 5000  # poll interval, 2000..=5000

# Active window title from a Win32 foreground hook (event-driven, no polling).
# The cell shows the focused window title, truncated to fit the bar.
# Disabled by default; add "active_window" to [layout] to show it.
[modules.active_window]
enabled = false

# AI usage module.
# mode = "mock" uses deterministic local demo data; mode = "real" reads the
# enabled providers below. Neither mode makes network requests or needs keys.
# Any other mode value fails validation.
[ai]
enabled = false         # set true to show the AI icon and popup
mode = "mock"           # "mock" or "real"
interval_ms = 300000    # provider poll interval (5 minutes)
warn_below = 0.20       # warn when <=20% of a usage window remains
urgent_below = 0.0      # urgent at 0 left / limit hit

# Undocumented endpoints can break without notice and are never enabled by
# default. This flag only gates providers that do not exist yet.
# experimental = false

# One block per provider. `root` can override the default local data location.
# [[ai.providers]]
# id = "claude-code"
# enabled = false
# interval_ms = 300000
# root = "/path/to/claude"  # optional: override default local data location
# limit = 1000000           # token limit for the usage window, must be > 0
# reset_after_secs = 18000
# reset_anchor_secs = 1700000000  # optional epoch anchor; omit for a rolling window

# [[ai.providers]]
# id = "opencode"
# enabled = false
# interval_ms = 300000
# limit = 1000000
# reset_after_secs = 18000
# reset_anchor_secs = 1700000000  # optional epoch anchor; omit for a rolling window

# Official usage APIs (real vendor percentages and reset times). These do NOT
# use `limit`, `reset_after_secs` or `root` above; those are local-provider
# settings. Each official provider needs a credential in the Windows
# Credential Manager, stored with:
#   wayward --set-credential claude-official
# The secret is read from stdin with echo disabled and is NEVER written to
# this file or to logs. Use --delete-credential <id> to remove one.
# Do not enable a provider until its credential has been stored.
# [[ai.providers]]
# id = "claude-official"   # api.anthropic.com/api/oauth/usage
# enabled = false
# interval_ms = 300000

# [[ai.providers]]
# id = "codex-official"    # chatgpt.com/backend-api/api/codex/usage
# enabled = false
# interval_ms = 300000
# account = ""             # optional non-secret chatgpt-account-id header

# [[ai.providers]]
# id = "opencode-official" # opencode.ai/zen/go/v1/usage (requires Go plan)
# enabled = false
# interval_ms = 300000

# Experimental: an undocumented internal endpoint from the reference project.
# It can change or break without notice; unknown response shapes fail closed.
# Requires BOTH this flag and an enabled provider entry. Never enabled by default.
# experimental = true
# [[ai.providers]]
# id = "manus-experimental"  # api.manus.im/user.v1.UserService/GetAvailableCredits
# enabled = false
# interval_ms = 300000
