[workspace]
members = [
    "crates/wayward-core",
    "crates/wayward-modules",
    "crates/wayward-ai",
    "crates/wayward-platform",
    "crates/wayward-app",
]
resolver = "3"

[workspace.package]
edition = "2021"
rust-version = "1.95"
version = "0.1.0"

[workspace.dependencies]
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
dirs = "7.0.0"
jiff = "1.0.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
anyhow = "1.0.104"
async-trait = "0.1.92"
tokio = { version = "1.54.1", features = ["time", "rt"] }
serde_json = "1.0.154"
rusqlite = { version = "0.43.0", features = ["bundled"] }
sysinfo = "0.40.4"
notify = "8.2.0"
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_Console", "Win32_System_Power", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Networking_NetworkListManager", "Win32_UI_Accessibility", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
